services:

  # =====================================================
  # KAFKA BROKER
  # =====================================================
  broker:
    image: apache/kafka:4.3.1
    container_name: icestream-kafka
    hostname: broker
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: >-
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092,
        PLAINTEXT://:19092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT_HOST://localhost:9092,
        PLAINTEXT://broker:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s


  # =====================================================
  # CREATE ALL KAFKA TOPICS
  # orders              : Member 1 -> Member 2
  # transformed-orders  : Member 2 -> Member 3
  # validated-orders    : Member 3 -> Member 2
  # =====================================================
  kafka-topic:
    image: apache/kafka:4.3.1
    container_name: icestream-topic-creator

    depends_on:
      broker:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server broker:19092 \
          --create \
          --if-not-exists \
          --topic orders \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server broker:19092 \
          --create \
          --if-not-exists \
          --topic transformed-orders \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server broker:19092 \
          --create \
          --if-not-exists \
          --topic validated-orders \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topics are ready: orders, transformed-orders, validated-orders"


  # =====================================================
  # DOWNLOAD FLINK CONNECTOR JARS
  # =====================================================
  flink-connectors:
    image: alpine:3.20
    container_name: icestream-flink-connectors

    volumes:
      - flink_connectors:/connectors

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Downloading Kafka connector..."
        wget -q \
          -O /connectors/flink-sql-connector-kafka-3.4.0-1.20.jar \
          https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.4.0-1.20/flink-sql-connector-kafka-3.4.0-1.20.jar

        echo "Downloading Iceberg connector..."
        wget -q \
          -O /connectors/iceberg-flink-runtime-1.20-1.11.0.jar \
          https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-flink-runtime-1.20/1.11.0/iceberg-flink-runtime-1.20-1.11.0.jar

        echo "Downloading Hadoop client API..."
        wget -q \
          -O /connectors/hadoop-client-api-3.3.6.jar \
          https://repo.maven.apache.org/maven2/org/apache/hadoop/hadoop-client-api/3.3.6/hadoop-client-api-3.3.6.jar

        echo "Downloading Hadoop client runtime..."
        wget -q \
          -O /connectors/hadoop-client-runtime-3.3.6.jar \
          https://repo.maven.apache.org/maven2/org/apache/hadoop/hadoop-client-runtime/3.3.6/hadoop-client-runtime-3.3.6.jar

        echo "Downloading Commons Logging..."
        wget -q \
          -O /connectors/commons-logging-1.2.jar \
          https://repo.maven.apache.org/maven2/commons-logging/commons-logging/1.2/commons-logging-1.2.jar

        echo "All connector files downloaded successfully."


  # =====================================================
  # FLINK JOB MANAGER
  # =====================================================
  jobmanager:
    image: flink:1.20-java17
    container_name: icestream-jobmanager
    hostname: jobmanager
    user: "0:0"
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      kafka-topic:
        condition: service_completed_successfully
      flink-connectors:
        condition: service_completed_successfully

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        mkdir -p /opt/flink/warehouse
        chmod -R 777 /opt/flink/warehouse
        cp /connectors/*.jar /opt/flink/lib/
        exec /docker-entrypoint.sh jobmanager

    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE

    volumes:
      - flink_connectors:/connectors:ro
      - ./flink:/opt/flink/sql:ro
      - iceberg_warehouse:/opt/flink/warehouse


  # =====================================================
  # FLINK TASK MANAGER
  # =====================================================
  taskmanager:
    image: flink:1.20-java17
    container_name: icestream-taskmanager
    hostname: taskmanager
    user: "0:0"
    restart: unless-stopped

    depends_on:
      jobmanager:
        condition: service_started
      flink-connectors:
        condition: service_completed_successfully

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        mkdir -p /opt/flink/warehouse
        chmod -R 777 /opt/flink/warehouse
        cp /connectors/*.jar /opt/flink/lib/
        exec /docker-entrypoint.sh taskmanager

    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1

    volumes:
      - flink_connectors:/connectors:ro
      - ./flink:/opt/flink/sql:ro
      - iceberg_warehouse:/opt/flink/warehouse


# =====================================================
# DOCKER VOLUMES
# =====================================================
volumes:
  flink_connectors:
  iceberg_warehouse:
